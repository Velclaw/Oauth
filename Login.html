<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập · Velclaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --btn:#1B1B1B;
    --btn-hover:#262626;
    --border:#2A2A2A;
    --text:#F5F5F5;
    --text-dim:#9A9A9A;
    --accent:#22C7F5;
    --accent-2:#8B2CFA;
    --input-bg:#0D0D0D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .card{
    width:100%;
    max-width:400px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .logo-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:-6px;
  }
  .logo-wrap img{
    height:44px;
    width:auto;
    display:block;
  }

  .head{ text-align:center; }
  .head h1{
    font-size:24px;
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .head p{
    margin:0;
    font-size:14.5px;
    color:var(--text-dim);
  }

  .oauth-list{ display:flex; flex-direction:column; gap:10px; }

  .oauth-btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:12px 16px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--btn);
    color:var(--text);
    font-size:14.5px;
    font-weight:500;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .oauth-btn:hover{ background:var(--btn-hover); }
  .oauth-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .oauth-btn .icon{
    width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .oauth-btn span.label{ flex:1; text-align:center; }

  .divider{
    display:flex; align-items:center; gap:14px;
    color:#6B6B6B;
    font-size:11.5px;
    letter-spacing:0.08em;
    margin:2px 0;
  }
  .divider::before,.divider::after{
    content:""; flex:1; height:1px; background:var(--border);
  }

  form{ display:flex; flex-direction:column; gap:10px; }

  .field input{
    width:100%;
    font-family:inherit;
    font-size:14.5px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--input-bg);
    color:var(--text);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder{ color:#6B6B6B; }
  .field input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(34,199,245,0.18);
  }

  .btn-submit{
    padding:12px 16px;
    border:none;
    border-radius:10px;
    background:#F5F5F5;
    color:#0A0A0A;
    font-size:14.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .btn-submit:hover{ background:#E2E2E2; }
  .btn-submit:active{ transform:translateY(1px); }
  .btn-submit:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .signup{
    text-align:center;
    font-size:13.5px;
    color:var(--text-dim);
  }
  .signup a{
    background:linear-gradient(90deg, var(--accent-2), var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-decoration:none;
    font-weight:700;
  }
  .signup a:hover{ text-decoration:underline; text-decoration-color:var(--accent); }

  .err{
    display:none;
    font-size:13px;
    color:#FF8A80;
    background:rgba(255,138,128,0.08);
    border:1px solid rgba(255,138,128,0.3);
    padding:10px 12px;
    border-radius:8px;
    text-align:center;
  }
  .err.show{ display:block; }
</style>
</head>
<body>

<div class="card">

  <div class="logo-wrap">
    <img src="velclaw_logo.gif" alt="Velclaw">
  </div>

  <div class="head">
    <h1>Chào mừng trở lại!</h1>
    <p>Đăng nhập vào tài khoản của bạn</p>
  </div>

  <div class="oauth-list">
    <button type="button" class="oauth-btn">
      <span class="icon">
        <svg viewBox="0 0 16 16" width="18" height="18" fill="#F5F5F5"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </span>
      <span class="label">Tiếp tục với GitHub</span>
    </button>

    <button type="button" class="oauth-btn">
      <span class="icon">
        <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.5-2.1 14.3-5.6l-6.6-5.6C29.7 34.7 27 35.5 24 35.5c-5.2 0-9.6-3.3-11.2-7.9l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C40.8 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      </span>
      <span class="label">Tiếp tục với Google</span>
    </button>

    <button type="button" class="oauth-btn">
      <span class="icon">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17l5-9 5 9M12 17l5-9 5 9"/><path d="M2 17c0 2 2 3 5 3s5-1 5-3"/><path d="M12 17c0 2 2 3 5 3s5-1 5-3"/></svg>
      </span>
      <span class="label">Tiếp tục với Windsurf</span>
    </button>
  </div>

  <div class="divider">HOẶC</div>

  <div class="err" id="formError">Vui lòng nhập địa chỉ email hợp lệ.</div>

  <form id="loginForm" novalidate>
    <div class="field">
      <input type="email" id="email" name="email" placeholder="Địa chỉ email" autocomplete="email" required>
    </div>
    <button type="submit" class="btn-submit">Đăng nhập</button>
  </form>

  <div class="signup">Chưa có tài khoản? <a href="register.html">Đăng ký</a></div>

</div>

<script>
  const form = document.getElementById('loginForm');
  const err = document.getElementById('formError');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!form.checkValidity()) {
      err.classList.add('show');
      return;
    }
    err.classList.remove('show');
    alert('Đăng nhập thành công (demo).');
  });
</script>

</body>
  </html>
