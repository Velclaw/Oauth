<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Đăng nhập · Velclaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--btn:#1b1b1b;--hover:#262626;--border:#2a2a2a;--text:#f5f5f5;--dim:#9a9a9a;--accent:#22c7f5;--purple:#8b2cfa;--input:#0d0d0d}*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:22px}.logo-wrap{text-align:center;margin-bottom:-6px}.logo-wrap img{height:44px;width:auto}.head{text-align:center}.head h1{font-size:24px;margin:0 0 8px}.head p{margin:0;color:var(--dim);font-size:14.5px}.oauth-list{display:flex;flex-direction:column;gap:10px}.oauth-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--btn);color:var(--text);font:500 14.5px Inter,sans-serif;cursor:pointer}.oauth-btn:hover{background:var(--hover)}.oauth-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.label{flex:1;text-align:center}.divider{display:flex;align-items:center;gap:14px;color:#6b6b6b;font-size:11.5px;letter-spacing:.08em}.divider:before,.divider:after{content:"";height:1px;background:var(--border);flex:1}form{display:flex;flex-direction:column;gap:10px}.field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);font:14.5px Inter,sans-serif;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,199,245,.18)}.btn-submit{padding:12px 16px;border:0;border-radius:10px;background:#f5f5f5;color:#0a0a0a;font:600 14.5px Inter,sans-serif;cursor:pointer}.signup{text-align:center;font-size:13.5px;color:var(--dim)}.signup a{color:#22c7f5;font-weight:700;text-decoration:none}.err{display:none;font-size:13px;color:#ff8a80;background:rgba(255,138,128,.08);border:1px solid rgba(255,138,128,.3);padding:10px 12px;border-radius:8px;text-align:center}.err.show{display:block}
</style>
</head>
<body>
<div class="card">
<div class="logo-wrap"><img src="velclaw_logo.gif" alt="Velclaw"></div>
<div class="head"><h1>Chào mừng trở lại!</h1><p>Đăng nhập vào tài khoản của bạn</p></div>
<div class="oauth-list">
<button type="button" class="oauth-btn" id="githubBtn"><span class="icon"><svg viewBox="0 0 16 16" width="18" height="18" fill="#f5f5f5"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></span><span class="label">Tiếp tục với GitHub</span></button>
<button type="button" class="oauth-btn" id="googleBtn"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M21.35 12.27c0-.79-.07-1.55-.22-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42Z"/><path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.53A9.75 9.75 0 0 0 12 21.75Z"/><path fill="#FBBC05" d="M6.54 13.83A5.86 5.86 0 0 1 6.23 12c0-.64.11-1.26.31-1.83V7.64H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.04 4.36l3.25-2.53Z"/><path fill="#EA4335" d="M12 6.14c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.2 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.71 5.39l3.25 2.53C7.31 7.86 9.46 6.14 12 6.14Z"/></svg></span><span class="label">Tiếp tục với Google</span></button>
<button type="button" class="oauth-btn" id="chatgptBtn"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#f5f5f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 9.1a5.1 5.1 0 0 0-7.4-4.4 5.1 5.1 0 0 0-8.9 4.4 5.1 5.1 0 0 0 2.6 8.4 5.1 5.1 0 0 0 8.8 1.8 5.1 5.1 0 0 0 7.3-4.5 5.1 5.1 0 0 0-.4-5.7Z"/><path d="m8.1 7.1 7.8 4.5M8.1 16.9l7.8-4.5M12 4.7v14.6"/></svg></span><span class="label">Tiếp tục với ChatGPT</span></button>
</div>
<div class="divider">HOẶC</div>
<div class="err" id="formError">Vui lòng nhập địa chỉ email hợp lệ.</div>
<form id="loginForm" novalidate><div class="field"><input type="email" id="email" name="email" placeholder="Địa chỉ email" autocomplete="email" required></div><button type="submit" class="btn-submit">Đăng nhập</button></form>
<div class="signup">Chưa có tài khoản? <a href="register.html">Đăng ký</a></div>
</div>
<script>
const form=document.getElementById('loginForm'),err=document.getElementById('formError');
form.addEventListener('submit',e=>{e.preventDefault();if(!form.checkValidity()){err.classList.add('show');return}err.classList.remove('show');alert('Đăng nhập thành công (demo).')});
document.getElementById('githubBtn').addEventListener('click',()=>alert('GitHub OAuth chưa được cấu hình.'));
document.getElementById('googleBtn').addEventListener('click',()=>alert('Google OAuth chưa được cấu hình.'));
document.getElementById('chatgptBtn').addEventListener('click',()=>alert('ChatGPT OAuth chưa được cấu hình.'));
</script>
</body>
</html>
