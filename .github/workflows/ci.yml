name: OAuth CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This repository currently has no committed package-lock.json.
      # npm ci and setup-node's npm cache both require a lockfile.
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run build
